# =============================================================================
# Zenith CI/CD Safety Net — GitHub Actions Workflow
# =============================================================================
# This workflow runs on every push to any branch.
# 1. It checks out the repository code.
# 2. It runs the test suite.
# 3. If tests FAIL, it clones the Zenith AI agent, installs it,
#    and lets it autonomously fix the bug and open a Pull Request.
# =============================================================================

name: Zenith CI Safety Net

on:
  push:
    branches-ignore:
      - 'zenith/**'    # Don't trigger on Zenith's own fix branches (prevents loops)

permissions:
  contents: write      # Allow Zenith to push branches
  pull-requests: write # Allow Zenith to open PRs

jobs:
  test-and-fix:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the repository ────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history so Zenith can read git diffs

      # ── 2. Set up Python ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 3. Install project dependencies ───────────────────────────
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      # ── 4. Run Tests ──────────────────────────────────────────────
      - name: Run Tests
        id: run_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -x -v 2>&1 | tee pytest_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      # ── 5. If tests passed, we're done ────────────────────────────
      - name: Check test result
        if: steps.run_tests.outcome == 'success'
        run: echo "✅ All tests passed. No action needed."

      # ── 6. If tests failed, activate Zenith ───────────────────────
      - name: Clone Zenith
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "❌ Tests failed. Cloning Zenith..."
          git clone https://github.com/${{ secrets.ZENITH_REPO || 'VedantGadge/Zenith' }}.git /tmp/zenith

      - name: Install Zenith
        if: steps.run_tests.outcome == 'failure'
        run: |
          cd /tmp/zenith
          pip install -r requirements.txt

      - name: Configure Git for Zenith
        if: steps.run_tests.outcome == 'failure'
        run: |
          git config --global user.name "Zenith Bot"
          git config --global user.email "zenith-bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Run Zenith Agent
        if: steps.run_tests.outcome == 'failure'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: /tmp/zenith
        run: |
          cd ${{ github.workspace }}
          python -m zenith.cli --repo . --test-command "python -m pytest -x -v" --base-branch main
